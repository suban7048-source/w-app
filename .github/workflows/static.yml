# Simple workflow for deploying static content to GitHub Pages
# Main branch repository deployment sync
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5.0.0
        continue-on-error: true

      - name: Upload artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages (Actions Source)
        id: deployment
        if: steps.setup_pages.outcome == 'success'
        uses: actions/deploy-pages@v4.0.5
        continue-on-error: true

      - name: Deploy to gh-pages branch (Branch Source Fallback)
        if: steps.setup_pages.outcome != 'success' || steps.deployment.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
